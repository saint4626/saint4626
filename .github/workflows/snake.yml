name: Build profile activity

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate monochrome contribution animations
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: saint4626
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#000000&color_dots=#ededed,#a1a1a1,#737373,#404040,#262626&color_dot_border=#d4d4d4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ededed&color_dots=#262626,#404040,#737373,#a1a1a1,#ededed&color_dot_border=#262626
      - name: Add static snapshots and reduced-motion support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re

          paths = sorted(Path("dist").glob("*.svg"))
          if len(paths) != 2:
              raise RuntimeError("Expected both light and dark contribution graphs")
          destination = Path("published")
          destination.mkdir(exist_ok=True)
          frozen = "*{animation:none!important}.s,.u{display:none}"
          def static_snapshot(source):
              root = ET.fromstring(source)
              style = next(node for node in root if node.tag.endswith("style"))
              css = style.text or ""
              variables = dict(re.findall(r"(--[\w-]+):([^;}]+)", css))
              fills = dict(re.findall(r"\.c\.([\w-]+)\{fill:var\((--[\w-]+)\)", css))
              root.remove(style)
              for parent in list(root.iter()):
                  for node in list(parent):
                      classes = node.get("class", "").split()
                      if "s" in classes or "u" in classes:
                          parent.remove(node)
                          continue
                      if "c" in classes:
                          variable = next((fills[c] for c in classes if c in fills), "--ce")
                          node.set("fill", variables[variable])
                          node.set("stroke", variables["--cb"])
                          node.set("stroke-width", "1")
                          node.set("width", "12")
                          node.set("height", "12")
                          node.attrib.pop("class", None)
              ET.register_namespace("", "http://www.w3.org/2000/svg")
              return ET.tostring(root, encoding="unicode")

          for path in paths:
              source = path.read_text()
              if "</style>" not in source:
                  raise RuntimeError(f"No style block in {path}")
              static = static_snapshot(source)
              animated = source.replace(
                  "</style>",
                  "@media (prefers-reduced-motion:reduce){" + frozen + "}</style>",
                  1,
              )
              ET.fromstring(static)
              ET.fromstring(animated)
              (destination / (path.stem + "-static.svg")).write_text(static)
              (destination / path.name).write_text(animated)
          PY
      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@5859b4ea7efe6b470a5b19c570460eae9323aefc # v3
        with:
          target_branch: output
          build_dir: published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
